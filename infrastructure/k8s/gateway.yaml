apiVersion: apps/v1
kind: Deployment
metadata:
  name: inference-gateway
  namespace: ai-platform
spec:
  replicas: 1
  selector:
    matchLabels:
      app: inference-gateway
  template:
    metadata:
      labels:
        app: inference-gateway
    spec:
      containers:
        - name: gateway
          image: ai-inference-platform-inference-gateway:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 8000
          env:
            - name: SPRING_DATA_REDIS_HOST
              value: "redis"
            - name: SPRING_KAFKA_BOOTSTRAP_SERVERS
              value: "kafka:9092"
          resources:
            requests:
              memory: "512Mi"
              cpu: "250m"
            limits:
              memory: "2Gi"
              cpu: "1"
---
apiVersion: v1
kind: Service
metadata:
  name: inference-gateway
  namespace: ai-platform
spec:
  selector:
    app: inference-gateway
  ports:
    - port: 8000
      targetPort: 8000
      nodePort: 30800
  type: NodePort