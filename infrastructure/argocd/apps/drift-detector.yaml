apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: drift-detector
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/toosparks/ai-inference-platform.git
    targetRevision: main
    path: infrastructure/helm/drift-detector
    helm:
      releaseName: drift-detector
  destination:
    server: https://kubernetes.default.svc
    namespace: ai-platform
  syncPolicy:
    automated:
      prune: true
      selfHeal: true