server.port=8084
spring.application.name=drift-detector

spring.datasource.url=jdbc:clickhouse://localhost:8123/aiplatform
spring.datasource.username=aiplatform
spring.datasource.password=aiplatform
spring.datasource.driver-class-name=com.clickhouse.jdbc.ClickHouseDriver

spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.producer.properties.spring.json.add.type.headers=false
spring.kafka.consumer.group-id=drift-detector-group
spring.kafka.consumer.auto-offset-reset=latest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JacksonJsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=ru.itis.drift.dto
spring.kafka.consumer.properties.spring.json.value.default.type=ru.itis.drift.dto.InferenceEvent

drift.threshold=0.3
drift.baseline.window-minutes=60
drift.current.window-minutes=10

management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.prometheus.metrics.export.enabled=true

server.address=127.0.0.1

management.metrics.distribution.percentiles-histogram.http.server.requests=true
management.metrics.distribution.percentiles-histogram.http.client.requests=true