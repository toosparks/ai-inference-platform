name: Build inference-gateway

on:
  push:
    branches: [main]
    paths:
      - 'services/inference-gateway/**'
      - '.github/workflows/inference-gateway.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Build JAR with Maven
        working-directory: services/inference-gateway
        run: mvn clean package -DskipTests

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./services/inference-gateway
          push: true
          tags: |
            ghcr.io/toosparks/inference-gateway:latest
            ghcr.io/toosparks/inference-gateway:${{ github.sha }}