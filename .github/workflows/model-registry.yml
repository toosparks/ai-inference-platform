name: Build model-registry

on:
  push:
    branches: [main]
    paths:
      - 'services/model-registry/**'
      - '.github/workflows/model-registry.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Build JAR with Maven
        working-directory: services/model-registry
        run: mvn clean package -DskipTests

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./services/model-registry
          push: true
          tags: |
            ghcr.io/toosparks/model-registry:latest
            ghcr.io/toosparks/model-registry:${{ github.sha }}